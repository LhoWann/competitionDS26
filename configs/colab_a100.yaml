# Colab A100 (single GPU, bf16): same recipe as base.yaml with a larger batch; outputs persist on Google Drive.
name: convnext_t_t8
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 8
  img_size: [224, 384]
  clips_per_video: 16
  num_workers: 8
model:
  backbone: convnext_tiny.fb_in22k
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 12
  batch_size: 16
  lr: 3.0e-4
  backbone_lr: 3.0e-5
  optimizer: adamw
  mixed_precision: bf16