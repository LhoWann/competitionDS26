# Colab A100 (or L4), bf16: VideoMAE ViT-B fine-tuned on Kinetics-400 (spatio-temporal attention over 16 frames, so
# repeated peeking and wrist/watch motion are modelled jointly) on 224x224 person crops from the clip's own YOLO11s-pose
# boxes. ~0.6 GB per clip in training with SDPA, so 16 clips/step fits both GPUs. Schedule: 10-epoch cosine but only its
# first 2 epochs are trained (train.stop_epoch): epoch 2 was the fold-mean peak on folds 0-2 (AUC 0.727 / F1@thr 0.656),
# a weaker pick than for V-JEPA 2: it wins clearly only on fold 2 (AUC 0.751 vs 0.694 at epoch 4), folds 0-1 are tied.
# Same augmentation as that measured run (hue jitter kept). All 5 folds, honest OOF; validation also records the
# flip-TTA variant (oof_flip.csv), and the variant with the higher 5-fold OOF AUC is the one used on test.
name: videomae_b_crop_s2
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 16
  img_size: [224, 224]
  clips_per_video: 16
  num_workers: 12
  crop_scale: [0.7, 1.0]
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
model:
  kind: videomae
  backbone: MCG-NJU/videomae-base-finetuned-kinetics
  dropout: 0.3
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 10
  stop_epoch: 2
  eval_last: true  # epoch fixed: skip the unused epoch-1 validation and checkpoint
  resume: true  # after a VM restart, skip folds that already have oof.csv + best.pt
  batch_size: 16
  lr: 3.0e-4
  backbone_lr: 2.0e-5
  optimizer: adamw
  ema: 0.998
  select: epoch
  patience: 99
  mixed_precision: bf16