# Colab (A100 or L4, bf16): VideoMAE ViT-B fine-tuned on Kinetics-400 (spatio-temporal attention over 16 frames, so
# repeated peeking and wrist/watch motion are modelled jointly) on 224x224 person crops from the clip's own YOLO11s-pose
# boxes. Measured ~0.6 GB per clip in training with SDPA, so 16 clips/step fits both GPUs.
name: videomae_b_crop
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 16
  img_size: [224, 224]
  clips_per_video: 16
  num_workers: 10
  crop_scale: [0.7, 1.0]
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
model:
  kind: videomae
  backbone: MCG-NJU/videomae-base-finetuned-kinetics
  dropout: 0.3
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 10
  batch_size: 16
  lr: 3.0e-4
  backbone_lr: 2.0e-5
  optimizer: adamw
  ema: 0.998
  select: f1_macro
  patience: 3
  mixed_precision: bf16