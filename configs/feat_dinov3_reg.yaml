# Laptop: frozen DINOv3 ViT-B head with stronger regularization (narrow head, dropout 0.5, weight decay 0.1, lower lr).
# CLS + mean patch token per frame; the grid variant is `--set features.pool=grid name=feat_grid_reg`.
name: feat_cls_reg
data:
  num_workers: 0
features:
  backbone: vit_base_patch16_dinov3.lvd1689m
  img_size: [224, 384]
  stride: 2
  pool: cls_mean
model:
  kind: features
  hidden: 128
  dropout: 0.5
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 30
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.1
  patience: 8
  mixed_precision: "no"