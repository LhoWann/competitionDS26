# Colab A100 40GB (bf16): ConvNeXt-B in22k clip classifier. Every test clip is predicted on its own (the rules forbid
# grouping test sequences), so training, selection and threshold are clip-level. 16 clips x 8 frames = 128 images;
# measured 0.21 GB/image + 1.2 GB weights/AdamW -> ~28 GB peak. Larger model than base.yaml -> lower backbone lr and
# more drop_path; speed jitter (subject tempo), grayscale (HDR front vs SDR side) and EMA against subject overfit.
name: convnext_b_t8
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 8
  img_size: [224, 384]
  clips_per_video: 16
  num_workers: 10
  speed_jitter: 0.2
  grayscale: 0.1
model:
  backbone: convnext_base.fb_in22k
  drop_path: 0.3
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 10
  batch_size: 16
  lr: 3.0e-4
  backbone_lr: 2.0e-5
  optimizer: adamw
  ema: 0.998
  select: f1_macro
  patience: 3
  mixed_precision: bf16