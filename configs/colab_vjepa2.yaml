# Colab A100: V-JEPA 2 ViT-L (facebook/vjepa2-vitl-fpc16-256-ssv2, Something-Something v2 attentive probe; motion-centric
# hand/object actions) on 256x256 person crops, 16 frames. Encoder frozen except its last 2 blocks; the pretrained
# attentive pooler and a new 8-way head learn. Fixed 8 epochs (train.select=epoch) so the OOF is not inflated by
# per-fold best-epoch picking.
name: vjepa2_l_crop
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 16
  img_size: [256, 256]
  clips_per_video: 16
  num_workers: 10
  crop_scale: [0.7, 1.0]
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
model:
  kind: vjepa2
  backbone: facebook/vjepa2-vitl-fpc16-256-ssv2
  dropout: 0.3
  train_blocks: 2
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 8
  batch_size: 16
  lr: 1.0e-4
  backbone_lr: 1.0e-5
  optimizer: adamw
  ema: 0.998
  select: epoch
  patience: 99
  mixed_precision: bf16