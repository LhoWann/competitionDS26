# Colab A100: V-JEPA 2 ViT-L (facebook/vjepa2-vitl-fpc16-256-ssv2, Something-Something v2 attentive probe;
# motion-centric hand/object actions) on 256x256 person crops, 16 frames. Encoder frozen except its last 2 blocks; the
# pretrained attentive pooler and a new 8-way head learn (74.5M of 353M parameters). 0.43 GB per clip + 2.1 GB fixed in
# training, so 48 clips/step ~ 23 GB on a 40 GB A100 (lr scaled ~sqrt(3) from the 16-clip setting). GPU-bound: ~3
# min/epoch. Schedule: 4-epoch cosine but only its first 2 epochs are trained (train.stop_epoch): epoch 2 was the
# fold-mean peak of the full 4-epoch run on folds 0-2 (AUC 0.758 / F1@thr 0.683 vs 0.740 / 0.661 at epoch 4), and
# epoch 2 beats epoch 4 in each of the 3 folds. All 5 folds, honest OOF; validation also records the flip-TTA variant
# (oof_flip.csv), and the variant with the higher 5-fold OOF AUC is the one used on test.
name: vjepa2_l_crop_s2
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/drive/MyDrive/DataSlayer26/outputs
data:
  num_frames: 16
  img_size: [256, 256]
  clips_per_video: 16
  num_workers: 12
  crop_scale: [0.7, 1.0]
  hue: 0.0
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
model:
  kind: vjepa2
  backbone: facebook/vjepa2-vitl-fpc16-256-ssv2
  dropout: 0.3
  train_blocks: 2
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 4
  stop_epoch: 2
  eval_last: true  # epoch fixed: skip the unused epoch-1 validation and checkpoint
  resume: true  # after a VM restart, skip folds that already have oof.csv + best.pt
  batch_size: 48
  lr: 1.5e-4
  backbone_lr: 1.5e-5
  optimizer: adamw
  ema: 0.995
  select: epoch
  patience: 99
  mixed_precision: bf16