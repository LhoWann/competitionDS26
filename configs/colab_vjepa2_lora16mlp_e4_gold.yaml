# Colab A100: the LoRA16-MLP e4 recipe (colab_vjepa2_lora16mlp_e4_win.yaml) with window labels from the manual 30-fps
# cheating intervals (configs/cheat_intervals.json, cli.annotate) where annotated, the onset rule elsewhere; OOF / test
# use every frame (eval_passes 2, stride-1 crops; FAQ 66/70). Decision rule: agent_space/gold/PREREG.md.
name: vjepa2_l_lora16mlp_e4_crop_gold
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/outputs
data:
  num_frames: 16
  img_size: [256, 256]
  clips_per_video: 16
  num_workers: 12
  crop_scale: [0.7, 1.0]
  hue: 0.0
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
  onsets: configs/onsets.csv
  intervals: configs/cheat_intervals.json
  eval_passes: 2
  crop_features: yolo11s-pose_360x640_s1
model:
  kind: vjepa2
  backbone: facebook/vjepa2-vitl-fpc16-256-ssv2
  dropout: 0.3
  train_blocks: 0
  lora_rank: 16
  lora_mlp: true
  grad_checkpointing: true
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 4
  resume: true  # after a VM restart, skip folds that already have oof.csv + best.pt
  batch_size: 16
  grad_accum: 3  # = the effective 48; gradients reach every block
  lr: 3.0e-4
  backbone_lr: 1.5e-5
  optimizer: adamw
  ema: 0.995
  select: epoch
  patience: 99
  mixed_precision: bf16