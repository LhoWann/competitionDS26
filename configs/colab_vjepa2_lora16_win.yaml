# Colab A100: V-JEPA 2 ViT-L + pure LoRA rank 16 on q/k/v of all 24 blocks (no fully trained blocks), pooler +
# head, LR 3e-4 for LoRA and head, gradient checkpointing, micro-batch 16 x 3. Part of the #9 / #13 stacks.
name: vjepa2_l_lora16_crop_win
paths:
  data_dir: /content/data
  cache_dir: /content/cache
  output_dir: /content/outputs
data:
  num_frames: 16
  img_size: [256, 256]
  clips_per_video: 16
  num_workers: 12
  crop_scale: [0.7, 1.0]
  hue: 0.0
  speed_jitter: 0.2
  grayscale: 0.1
  person_crop: 1.15
  onsets: configs/onsets.csv
model:
  kind: vjepa2
  backbone: facebook/vjepa2-vitl-fpc16-256-ssv2
  dropout: 0.3
  train_blocks: 0
  lora_rank: 16
  grad_checkpointing: true
train:
  folds: [0, 1, 2, 3, 4]
  epochs: 4
  stop_epoch: 2
  eval_last: true  # epoch fixed: skip the unused epoch-1 validation and checkpoint
  resume: true  # after a VM restart, skip folds that already have oof.csv + best.pt
  batch_size: 16
  grad_accum: 3  # = the effective 48; gradients reach every block
  lr: 3.0e-4
  backbone_lr: 1.5e-5
  optimizer: adamw
  ema: 0.995
  select: epoch
  patience: 99
  mixed_precision: bf16